<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>分切疵点转印台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/ui.js"></script>
</head>
<body data-theme="slit" data-prefix="/slitweb/api/">
  <header class="top">
    <div><p class="eyebrow">卷材质量</p><h1>分切疵点转印台</h1></div>
    <div class="toolbar" aria-label="数据操作">
      <button id="sample">样例</button><button id="alternate">对照样例</button><button id="review-sample">复核样例</button>
      <button id="migration-before">改绕向早版</button><button id="migration-after">改绕向晚版</button>
      <label class="upload-label">导入数据<input id="upload" type="file" accept=".json,application/json" aria-label="导入数据"></label>
      <button id="evaluate">重新处理</button><button id="seal" class="primary">封存成果</button>
    </div>
  </header>
  <main>
    <p id="status" role="status" aria-live="polite">读取本地数据…</p>
    <div class="work">
      <section class="plot">
        <div class="plot-title"><h2>子卷走卷剖面</h2><code><span id="subject">—</span> · <span id="digest">—</span></code></div>
        <svg id="visual" role="img" aria-label="子卷走卷剖面" viewBox="0 0 720 238"></svg>
      </section>
      <nav id="stages" class="stage-list" aria-label="归约阶段"></nav>
      <details id="review-pane" class="review-pane" hidden>
        <summary>扩展复核</summary>
        <nav id="review-stages" class="stage-list" aria-label="扩展复核阶段"></nav>
      </details>
      <section class="result-shell" aria-label="结果明细">
        <div class="results-title"><h2 id="table-title">疵点转印</h2><span id="row-count"></span></div>
        <p id="empty" hidden>当前没有明细</p>
        <div class="table-scroll"><table id="result" hidden></table></div>
      </section>
    </div>
    <section class="revision">
      <h2>成果版本 <span id="archive-count"></span></h2>
      <div class="revision-tools">
        <label>参照版本<select id="left-version"></select></label>
        <label>目标版本<select id="right-version"></select></label>
        <button id="inspect">打开目标版本</button><button id="compare">查看差异与实物位置</button><a class="export-link" id="export" hidden>下载交接资料</a>
      </div>
      <section id="migration-pane" class="migration-pane" aria-label="实物位置迁移" hidden>
        <div class="migration-summary" id="migration-summary"></div>
        <h3>按母卷实物位置</h3>
        <div class="table-scroll"><table id="migration-regions" class="migration-table" hidden></table></div>
        <h3>幅域差异（不按原地修复核计）</h3>
        <p id="migration-domain-empty" class="migration-note" hidden>两版幅域一致，没有幅域差异。</p>
        <div class="table-scroll"><table id="migration-domains" class="migration-table" hidden></table></div>
      </section>
    </section>
    <details id="source-pane" class="input-pane"><summary>来源数据</summary><textarea id="source" spellcheck="false" aria-label="观测来源数据"></textarea></details>
  </main>
  <dialog id="detail" aria-labelledby="detail-title"><form method="dialog"><h2 id="detail-title"></h2><button>关闭</button></form><div id="detail-content"></div></dialog>
</body>
</html>
